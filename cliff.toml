# git-cliff configuration: https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md and the GitHub release notes from Conventional
# Commits.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file. It is
generated by [git-cliff](https://git-cliff.org) from the Conventional
Commits history; do not edit it by hand.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.breaking %} **(breaking)**{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/johu/larder/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = """

{% for release in releases -%}
  {% if release.version -%}
    {% if release.previous and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/johu/larder/compare/{{ release.previous.version }}...{{ release.version }}
    {% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/johu/larder/releases/tag/{{ release.version }}
    {% endif -%}
  {% elif release.previous and release.previous.version -%}
[unreleased]: https://github.com/johu/larder/compare/{{ release.previous.version }}...HEAD
  {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
topo_order = false

commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: initial commit", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  { message = "^build\\(deps", group = "<!-- 5 -->Dependencies" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 7 -->Build and CI" },
  { message = "^(chore|style|test)", group = "<!-- 8 -->Maintenance" },
]
